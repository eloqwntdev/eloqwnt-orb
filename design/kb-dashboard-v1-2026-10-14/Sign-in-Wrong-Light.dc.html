/* Vertus glass (UI kit 1843:5299): no fill, .6px stroke, inner blurred 2px ring ("elipse"), drop 0 2 4 #00000029 */
.vg{position:relative;background:transparent;border:.6px solid rgba(20,20,20,.16);box-shadow:0 2px 4px rgba(0,0,0,.16);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}

.vg:not(.vgl):not(.vgc)::after{border-width:1.5px;border-color:rgba(20,20,20,.06);filter:blur(1.5px)}
.vgl::after{left:1.4px;right:2.6px;top:5.4px;bottom:1.6px}

.vgc::after{left:3.4px;right:3.4px;top:8.4px;bottom:0;filter:blur(3px)}

.vchip{background:rgba(238,183,67,.18);color:#a8740a!important;border:0}

.vtx{background-image:linear-gradient(90deg,#fe7ac6 31.778%,#ff4665 84.059%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* CTA buttons: solid #111111, white text, Vertus glass-dark ring */
.vg.vtx{background:#111111!important;-webkit-background-clip:border-box;background-clip:border-box;color:#ffffff!important;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.vg.vtx::after{display:none}
