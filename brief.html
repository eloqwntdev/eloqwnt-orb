<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your brief · Eloqwnt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Besley:wght@400&family=Zalando+Sans:wght@300;400;500&display=swap">
<style>
:root{--page:#f6f8fc;--ink:#0b1020;--ink-2:#2a3248;--ink-3:#4a5268;--muted:#6b7489;--faint:#a4abbc;--chip:#eef1f5;--line:#e4e7ee;--hair:rgba(11,16,32,.08);--card:#ffffff;--btn:#0b1020;--btn-ink:#ffffff;--lime-dot:#a6e46a;color-scheme:light}
:root[data-theme="dark"]{--page:#0d161b;--ink:#eef3f6;--ink-2:#d6dfe5;--ink-3:#b6c3cc;--muted:#8e9ca7;--faint:#93aebc;--chip:rgba(255,255,255,.06);--line:rgba(255,255,255,.16);--hair:rgba(255,255,255,.09);--card:rgba(255,255,255,.04);--btn:#eef3f6;--btn-ink:#0b1020;--lime-dot:#c7f59a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:"Zalando Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
svg{display:block}
header{display:flex;align-items:center;justify-content:space-between;padding:32px clamp(20px,4vw,48px)}
.brand{display:flex;align-items:flex-start;gap:6px;color:var(--ink);text-decoration:none}
.brand .logo{width:107px;height:22px}
.brand span{font-family:Besley,Georgia,serif;font-size:16px;line-height:20px;margin-top:-1px}
.btn{height:48px;border-radius:999px;background:var(--btn);color:var(--btn-ink);display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:0 22px;font-weight:500;text-decoration:none;white-space:nowrap;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(11,16,32,.18)}
.ghost{height:40px;border-radius:999px;border:1px solid var(--line);background:var(--chip);display:inline-flex;align-items:center;gap:10px;padding:0 18px;font-size:15px;color:var(--ink-2);text-decoration:none;white-space:nowrap;transition:border-color .2s}
.ghost:hover{border-color:var(--faint)}
.btn svg,.ghost svg{width:18px;height:18px}
main{width:min(760px,100% - 40px);margin:56px auto 0;display:flex;flex-direction:column;gap:36px;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-size:14px;color:var(--muted)}
h1{font-weight:300;letter-spacing:-.02em;margin:0;line-height:1.1;font-size:clamp(34px,5vw,52px);text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:1px solid var(--hair)}
.sec h2{margin:0;font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec ul.dots{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.sec ul.dots li{display:flex;gap:10px;font-size:16px;line-height:1.5;color:var(--ink-2)}
.sec ul.dots li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime-dot);flex:none;margin-top:9px}
.sec p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-2)}
.sec p.big{font-size:18px}
.phase{display:grid;grid-template-columns:160px 1fr;gap:8px 24px;padding:18px 0;border-top:1px solid var(--hair)}
.phase:first-of-type{border-top:0}
.phase b{font-weight:500;font-size:18px}
.phase ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:16px;line-height:1.6}
.phase .wk{font-size:15px;color:var(--ink-3)}
.price{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--hair)}
.price span:last-child{color:var(--ink-3);white-space:nowrap}
.fine{font-size:13px;line-height:1.5;color:var(--muted)}
.case{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .2s,transform .3s cubic-bezier(.2,.8,.2,1)}
a.case:hover{border-color:var(--faint);transform:translateY(-2px)}
.case .img{width:96px;height:64px;border-radius:12px;flex:none;background:radial-gradient(70% 70% at 30% 25%,#2d5a73,#0b1a22)}
.case .tx{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.case .tag{font-size:13px;color:var(--muted)}
.case b{font-weight:500;font-size:17px}
.case .res{font-size:15px;color:var(--ink-2)}
.case svg{width:18px;height:18px;flex:none;color:var(--ink-3)}
.talk{display:flex;gap:16px;align-items:center;padding:28px 32px;border-radius:24px;background:var(--card);border:1px solid var(--line);margin-bottom:60px}
.talk .who{display:flex;gap:14px;align-items:center;flex:1}
.talk img{width:48px;height:48px;border-radius:50%}
.talk b{font-weight:500;font-size:18px;display:block}
.talk .who span span{color:var(--ink-3);font-size:15px}
.state{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.state h1{font-size:34px}
.state p{color:var(--ink-3);margin:0;max-width:440px}
footer{width:min(760px,100% - 40px);margin:0 auto;padding:24px 0 40px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--faint);font-size:14px}
footer a{color:var(--ink-3)}
@media (max-width:640px){
  header{padding:24px 20px 0}
  .brand span,.hide-sm{display:none}
  main{margin-top:28px;gap:28px}
  .phase{grid-template-columns:1fr}
  .case .img{width:72px;height:56px}
  .case svg{display:none}
  .talk{flex-direction:column;align-items:stretch;padding:22px}
}
@media print{header .ghost,.talk .btn{display:none}body{background:#fff}}
@media (prefers-reduced-motion:reduce){main{animation:none}}
</style>
</head>

<div id="out"><div class="state" aria-busy="true"><p>Opening your brief…</p></div></div>
<script>
(() => {
  try { const t = localStorage.getItem("ev-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  const out = document.getElementById("out");
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const CAL = "https://calendly.com/eloqwnt";
  const cal = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5h13v11h-13zM3.5 8.5h13M7 3v3.5M13 3v3.5"/></svg>';
  const arrow = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>';
  const id = (location.pathname.match(/\/brief\/([a-z0-9]+)/) || [])[1] || new URLSearchParams(location.search).get("id");
  const fail = (h, p) => { out.innerHTML = `<div class="state"><h1>${h}</h1><p>${p}</p><a class="btn" href="/">Talk to the orb ${arrow}</a></div>`; };
  if (!id) return fail("No brief here", "This link is missing its brief. Ask the orb for a new one.");
  fetch("/api/brief?id=" + encodeURIComponent(id)).then(async (r) => {
    const b = await r.json().catch(() => ({}));
    if (!r.ok) return fail(r.status === 403 ? "Almost there" : "Brief not found", esc(b.error || "Ask the orb for a new one."));
    const date = new Date(b.sentAt || b.createdAt).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    const words = esc(b.headline).split(" ");
    const head = words.length > 4 ? words.slice(0, -2).join(" ") + ` <em style="font-style:normal;color:var(--faint)">${words.slice(-2).join(" ")}</em>` : esc(b.headline);
    document.title = (b.company ? `Brief for ${b.company}` : "Your brief") + " · Eloqwnt";
    const dots = (a) => `<ul class="dots">${a.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`;
    out.innerHTML = `<main>
      <div style="display:flex;flex-direction:column;gap:14px"><span class="eyebrow">${[b.company ? "Brief for " + esc(b.company) : "Your brief", b.name ? "prepared for " + esc(b.name.split(" ")[0]) : "", date].filter(Boolean).join(" · ")}</span><h1>${head}</h1></div>
      ${b.told?.length ? `<section class="sec"><h2>What you told us</h2>${dots(b.told)}</section>` : ""}
      ${b.recommendation || b.approach ? `<section class="sec"><h2>Our recommendation</h2><p class="big">${esc(b.recommendation || b.approach)}</p></section>` : ""}
      ${b.phases?.length ? `<section class="sec" style="gap:0"><h2 style="margin-bottom:6px">Plan and timeline</h2>${b.phases.map((p, i) => `<div class="phase"><div><span class="eyebrow">Phase ${i + 1}</span><div class="wk">${esc(p.weeks)}</div></div><div><b>${esc(p.name)}</b>${p.items?.length ? `<ul>${p.items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div></div>`).join("")}</section>` : ""}
      ${b.prices?.length ? `<section class="sec"><h2>Starting prices</h2><div>${b.prices.map((p) => `<div class="price"><span>${esc(p.service)}</span><span>${esc(p.price)}</span></div>`).join("")}</div><p class="fine">Final scope and price are agreed on the call.</p></section>` : ""}
      ${b.cases?.length ? `<section class="sec"><h2>Similar work</h2><div style="display:flex;flex-direction:column;gap:10px">${b.cases.map((c) => { const inner = `<span class="img"></span><span class="tx"><span class="tag">${esc(c.tag)}</span><b>${esc(c.title)}</b>${c.result ? `<span class="res">${esc(c.result)}</span>` : ""}</span>${c.link ? arrow : ""}`; return c.link ? `<a class="case" href="${esc(c.link)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="case">${inner}</div>`; }).join("")}</div></section>` : ""}
      ${b.prep?.length ? `<section class="sec"><h2>To get the most from the call</h2>${dots(b.prep)}</section>` : ""}
      <div class="talk"><div class="who"><img src="/kb-assets/orb-logo.png" alt=""><span><b>Talk it through with Eloqwnt</b><span>20 minutes, no pitch deck needed</span></span></div><a class="btn" href="${CAL}" target="_blank" rel="noopener">${cal}Book a 20-minute call</a></div>
    </main>
    <footer><span>© ${new Date().getFullYear()} Eloqwnt</span><a href="mailto:hi@eloqwnt.com">hi@eloqwnt.com</a></footer>`;
  }).catch(() => fail("Couldn’t open the brief", "Check your connection and try again."));
})();
</script>
